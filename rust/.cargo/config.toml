[build]
# Default fallback target if none is specified via the command line
target = "x86_64-unknown-none"

# --- x86_64 Bare-Metal Target Configuration ---
[target.x86_64-unknown-none]
rustflags = [
    "-C", "link-arg=-nostartfiles",
]

# --- AArch64 Bare-Metal (64-bit ARM) Target Configuration ---
[target.aarch64-unknown-none]
rustflags = [
    "-C", "link-arg=-nostartfiles",
]

# --- RISC-V Bare-Metal (64-bit) Target Configuration ---
[target.riscv64imac-unknown-none-elf]
rustflags = [
    "-C", "link-arg=-nostartfiles",
]
