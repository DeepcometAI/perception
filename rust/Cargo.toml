[package]
name = "sel4-kernel"
version = "0.1.0"
edition = "2021"
authors = ["seL4 Contributors"]
license = "BSD-2-Clause"
description = "seL4 microkernel written in Rust"
repository = "https://github.com/seL4/perception"

[lib]
name = "sel4_kernel"
path = "src/lib.rs"

[[bin]]
name = "sel4-kernel"
path = "src/main.rs"
required-features = []

[dependencies]
# Core dependencies for kernel development
# To be expanded as the Rust rewrite progresses

[dev-dependencies]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[profile.dev]
opt-level = 0

# Placeholder for future kernel-specific configurations
# This will be expanded as the project develops
