version: 2
updates:
  # Meson subprojects (C tooling, libraries)
  - package-ecosystem: "meson"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "deps"
      include: "scope"

  # Python tooling (verification scripts, CI helpers)
  - package-ecosystem: "pip"
    directory: "/tools"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "deps"
      include: "scope"

  # GitHub Actions workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"
      include: "scope"

  # Rust crates (optional, only if /experiments/rust exists)
  # Dependabot will silently skip this if the directory is missing.
  - package-ecosystem: "cargo"
    directory: "/experiments/rust"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "deps"
      include: "scope"
