version: 2
updates:
  # 🐍 Python tooling (verification scripts, CI helpers)
  - package-ecosystem: "pip"
    directory: "/tools"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "deps"
      include: "scope"

  # ⚙️ GitHub Actions workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"
      include: "scope"

  # 🦀 Rust crates (optional, only if /experiments/rust exists)
  - package-ecosystem: "cargo"
    directory: "/experiments/rust"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "deps"
      include: "scope"

  # 📦 Git submodules
  - package-ecosystem: "gitsubmodule"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "deps"
      include: "scope"
